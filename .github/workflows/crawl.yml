name: crawl
on:
  schedule:
    - cron: "17 */6 * * *"      # كل 6 ساعات
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python crawler/crawl.py
      - name: commit catalog
        run: |
          git config user.name "kanz-bot"
          git config user.email "kanz-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "catalog update $(date -u +%F-%H%M)"; git push; fi
