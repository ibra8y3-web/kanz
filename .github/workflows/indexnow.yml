name: indexnow
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in the sitemap (first run / recovery)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: submit changed URLs to IndexNow
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then
            python crawler/indexnow.py --all
          else
            python crawler/indexnow.py --since-minutes 75
          fi
